<style id="css">
:root {
  --ground: #f2ede0;
  --surface: #fffdf8;
  --surface-2: #ece5d2;
  --ink: #23262d;
  --ink-soft: #565b6b;
  --ink-faint: #8b8c7c;
  --rule: #ddd6c1;
  --rule-strong: #c4bb9f;
  --accent: #33436e;
  --accent-ink: #ffffff;
  --accent-soft: #e2e6ef;
  --ok: #2f7a52;
  --ok-soft: #e2efe6;
  --warn: #9c6b12;
  --warn-soft: #f6ecd4;
  --stop: #a33f34;
  --stop-soft: #f5e2de;
  --shadow: 0 1px 2px rgba(35, 38, 45, .07), 0 10px 28px -18px rgba(35, 38, 45, .35);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #14161c;
    --surface: #1a1d25;
    --surface-2: #20232c;
    --ink: #e9e8e0;
    --ink-soft: #a7a89c;
    --ink-faint: #74766b;
    --rule: #2b2e38;
    --rule-strong: #3c4051;
    --accent: #9fb0dd;
    --accent-ink: #10131c;
    --accent-soft: #232a3d;
    --ok: #7fc39d;
    --ok-soft: #1b2b23;
    --warn: #dbab5c;
    --warn-soft: #2c2414;
    --stop: #e2938a;
    --stop-soft: #2f1d1b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px -18px rgba(0, 0, 0, .85);
  }
}

:root[data-theme="dark"] {
  --ground: #14161c;
  --surface: #1a1d25;
  --surface-2: #20232c;
  --ink: #e9e8e0;
  --ink-soft: #a7a89c;
  --ink-faint: #74766b;
  --rule: #2b2e38;
  --rule-strong: #3c4051;
  --accent: #9fb0dd;
  --accent-ink: #10131c;
  --accent-soft: #232a3d;
  --ok: #7fc39d;
  --ok-soft: #1b2b23;
  --warn: #dbab5c;
  --warn-soft: #2c2414;
  --stop: #e2938a;
  --stop-soft: #2f1d1b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px -18px rgba(0, 0, 0, .85);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { text-wrap: balance; margin: 0; }

:where(button, a, input, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* bandeau */

.bandeau {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.bandeau-corps {
  max-width: 1320px;
  margin: 0 auto;
  padding: 13px 28px;
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
}

.marque {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin-right: auto;
}

.marque-nom {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.marque-sous { font-size: 12.5px; color: var(--ink-faint); }

.jauge { display: flex; align-items: center; gap: 11px; }

.jauge-piste {
  width: 148px;
  height: 7px;
  border-radius: 99px;
  background: var(--rule);
  overflow: hidden;
  display: flex;
}

.jauge-seg {
  height: 100%;
  background: var(--rule-strong);
}

.jauge-seg[data-etat="cite"] { background: var(--warn); }
.jauge-seg[data-etat="confirmee"] { background: var(--ok); }

.jauge-txt {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.btn {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 13px;
  border-radius: 7px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}

.btn:hover { background: var(--surface-2); border-color: var(--ink-faint); }
.btn-fort { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-fort:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }

/* mise en page générale */

.corps {
  max-width: 1320px;
  margin: 0 auto;
  padding: 30px 28px 100px;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 40px;
  align-items: start;
}

@media (max-width: 900px) {
  .corps { grid-template-columns: 1fr; }
}

/* sidebar */

.rail {
  position: sticky;
  top: 68px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: calc(100vh - 90px);
  overflow-y: auto;
  padding-bottom: 8px;
}

@media (max-width: 900px) {
  .rail {
    position: static;
    flex-direction: row;
    overflow-x: auto;
    max-height: none;
    gap: 8px;
    padding-bottom: 4px;
    margin-bottom: 4px;
  }
}

.rail-lien {
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: left;
  padding: 9px 11px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  font: inherit;
}

@media (max-width: 900px) {
  .rail-lien {
    flex: 0 0 auto;
    min-width: 190px;
    border-color: var(--rule);
    background: var(--surface);
  }
}

.rail-lien:hover { background: var(--surface-2); }
.rail-lien[data-actif="1"] { background: var(--accent-soft); color: var(--ink); }

.rail-titre {
  font-size: 13px;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.rail-titre b { font-weight: 500; }
.rail-compte { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); flex: 0 0 auto; }

.rail-piste {
  height: 4px;
  border-radius: 99px;
  background: var(--rule);
  overflow: hidden;
}

.rail-part { height: 100%; background: var(--ok); }

/* colonne principale */

.intro {
  max-width: 68ch;
  margin-bottom: 26px;
}

.intro h1 {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -.015em;
  margin-bottom: 10px;
}

.intro p { margin: 0 0 8px; color: var(--ink-soft); }
.intro p:last-child { margin-bottom: 0; }

.legende {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 14px;
  font-size: 12.5px;
  color: var(--ink-soft);
}

.legende span { display: inline-flex; align-items: center; gap: 6px; }

.pastille {
  width: 8px;
  height: 8px;
  border-radius: 99px;
  flex: 0 0 auto;
}

.pastille[data-etat="inconnue"] { background: var(--rule-strong); }
.pastille[data-etat="cite"] { background: var(--warn); }
.pastille[data-etat="confirmee"] { background: var(--ok); }

.commandes {
  display: flex;
  gap: 8px;
  margin: 18px 0 26px;
}

.domaine {
  margin-bottom: 30px;
  scroll-margin-top: 78px;
}

.domaine-tete {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}

.domaine-tete h2 {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 600;
}

.domaine-compte {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-faint);
}

/* entrées */

.entree {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
}

.entree[data-etat="cite"] { border-left-color: var(--warn); }
.entree[data-etat="confirmee"] { border-left-color: var(--ok); background: var(--ok-soft); }

.entree-tete {
  width: 100%;
  appearance: none;
  font: inherit;
  text-align: left;
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
}

.entree-tete:hover { background: var(--surface-2); }

.entree-info { flex: 1; min-width: 0; }

.entree-id {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-faint);
  margin-bottom: 3px;
}

.entree-libelle { font-weight: 500; margin-bottom: 4px; }

.entree-valeur {
  display: inline-block;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-soft);
  background: var(--surface-2);
  border-radius: 4px;
  padding: 1px 6px;
  word-break: break-word;
  max-width: 100%;
}

.entree-droite {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 2px;
}

.entree-badge {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 5px;
  white-space: nowrap;
}

.entree-badge[data-etat="inconnue"] { background: var(--surface-2); color: var(--ink-faint); }
.entree-badge[data-etat="cite"] { background: var(--warn-soft); color: var(--warn); }
.entree-badge[data-etat="confirmee"] { background: var(--ok-soft); color: var(--ok); }

.entree-badge[data-etat="question"] { background: var(--stop-soft); color: var(--stop); }

.entree-question {
  font-size: 13px;
  color: var(--ink);
  background: var(--stop-soft);
  border-left: 3px solid var(--stop);
  border-radius: 6px;
  padding: 10px 12px;
}

.entree-question b {
  display: block;
  font-size: 10.5px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--stop);
  margin-bottom: 3px;
}

.suite {
  max-width: 68ch;
  margin: 0 0 26px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
}

.suite h2 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.suite p { margin: 0 0 8px; color: var(--ink-soft); font-size: 14px; }
.suite ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }

.suite-lien {
  font: inherit;
  font-size: 13px;
  text-align: left;
  width: 100%;
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 8px;
  color: var(--accent);
  cursor: pointer;
}

.suite-lien:hover { background: var(--accent-soft); }
.suite-lien span { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-left: 6px; }

.chevron {
  width: 9px;
  height: 9px;
  border-right: 1.5px solid var(--ink-faint);
  border-bottom: 1.5px solid var(--ink-faint);
  transform: rotate(-45deg);
  transition: transform .15s ease;
  flex: 0 0 auto;
}

.entree[data-ouverte="1"] .chevron { transform: rotate(45deg); }

.entree-corps {
  border-top: 1px solid var(--rule);
  background: var(--surface-2);
  padding: 14px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.entree[data-ouverte="0"] .entree-corps { display: none; }

.entree-utilise {
  font-size: 11.5px;
  color: var(--ink-faint);
  margin-top: 2px;
}

.champs {
  display: grid;
  grid-template-columns: 1.4fr 1.4fr .8fr;
  gap: 9px;
}

@media (max-width: 640px) {
  .champs { grid-template-columns: 1fr; }
}

.champ label {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 4px;
}

.champ input, .champ textarea {
  font: inherit;
  font-size: 13.5px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink);
}

.champ input:focus, .champ textarea:focus { border-color: var(--accent); }

.champ textarea { resize: vertical; min-height: 44px; }

.entree-note {
  font-size: 12.5px;
  color: var(--ink-soft);
  background: var(--surface);
  border: 1px dashed var(--rule-strong);
  border-radius: 7px;
  padding: 9px 11px;
}

.tranches-zone { overflow-x: auto; }

.tranches {
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 12.5px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 7px;
  overflow: hidden;
}

.tranches th, .tranches td {
  padding: 6px 12px;
  text-align: right;
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}

.tranches tr:last-child td { border-bottom: none; }

.tranches th {
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink-faint);
  text-align: right;
  background: var(--surface-2);
}

.tranches th:first-child, .tranches td:first-child { text-align: left; }
.tranches td.taux { color: var(--ink); font-weight: 500; }

.confirme-ligne {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

.confirme-ligne input[type="checkbox"] { width: 16px; height: 16px; }

/* barre flottante */

.barre {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 22px;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 14px 11px 20px;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 12px;
  box-shadow: var(--shadow);
  max-width: calc(100vw - 32px);
}

.barre[hidden] { display: none; }
.barre-txt { font-size: 13.5px; color: var(--ink-soft); }

.pied {
  margin-top: 36px;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
  color: var(--ink-faint);
  font-size: 12.5px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.mot {
  font-size: 13px;
  color: var(--ink-soft);
  padding: 4px 0;
  min-height: 18px;
}

.mot[data-ton="ok"] { color: var(--ok); }
.mot[data-ton="stop"] { color: var(--stop); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

e la part taxable de chaque bénéficiaire excédant cette limite."},"dmtg.bareme.frere-soeur":{"confirme":true,"reference":"CGI, art. 777","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000030061736","dateConsultation":"","note":"Une donation à un frère ou une sœur bénéficie d'un abattement de 15 932 € (art. 779 IV du CGI), apprécié par donateur et par bénéficiaire. En dessous de ce montant, aucun droit n'est dû, mais la donation reste à déclarer. Au-delà, la part taxable est soumise au barème spécifique aux frères et sœurs : 35 %jusqu'à 24 430 €, puis 45 %."},"dmtg.bareme.ligne-directe":{"confirme":true,"reference":"CGI art. 777","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000030061736","dateConsultation":"2026-08-26"},"dmtg.bareme.neveu-niece":{"confirme":true,"reference":"CGI,a rt. 777","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000030061736","dateConsultation":"2026-10-09"},"dmtg.bareme.tiers":{"confirme":true,"reference":"CGI, art. 777","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000030061736","dateConsultation":"2026-10-09"},"dmtg.conjoint.exonere":{"confirme":true,"reference":"CGi, art. 796-0 bis","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006305480","dateConsultation":"2026-10-09","note":"Sont exonérés de droits de mutation par décès le conjoint survivant et le partenaire lié au défunt par un pacte civil de solidarité."},"dmtg.usufruit.taux-nue-propriete":{"confirme":true,"reference":"CGI art. 669","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006310173","dateConsultation":"2026-08-26"},"ifi.bareme.progressif":{"confirme":true,"reference":"CGI, art. 977","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036385041/2018-01-01","dateConsultation":"2026-10-09"},"ifi.decote.montant":{"confirme":true,"reference":"CGI, art. 977","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036385041/2018-01-01","dateConsultation":"2026-10-09","note":"Le 2 de l'article 977 du CGI prévoit un mécanisme de décote pour atténuer l’effet de seuil à l’entrée du barème de l’IFI. Ainsi, pour les redevables dont le patrimoine immobilier a une valeur nette taxable égale ou supérieure à 1 300 000 € et inférieure à 1 400 000 €, le montant de l'impôt calculé selon le barème progressif est réduit d'une somme égale à 17 500 € - 1,25 % P (où P est la valeur nette taxable du patrimoine immobilier)."},"ifi.decote.plafond":{"confirme":true,"reference":"CGI, art. 977","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036385041/2018-01-01","dateConsultation":"2026-10-09"},"ifi.decote.taux":{"confirme":true,"reference":"CGI, art. 977","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036385041/2018-01-01","dateConsultation":"2026-10-09","note":"le montant de l'impôt calculé selon le tarif prévu est réduit d'une somme égale à 17 500 €-1,25 % P (où P est la valeur nette taxable du patrimoine)."},"ifi.exoneration.biens-ruraux.taux-plein":{"confirme":true,"reference":"CGI art. 975, II","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053542691","dateConsultation":"2026-08-26","note":"sont exonérés de droits de mutation à titre gratuit à concurrence des trois quarts de leur valeur, les biens donnés à bail à long terme dans les conditions prévues de l’article L. 416-1 du code rural et de la pêche maritime (C. rur.) à l’article L. 416-6 du C. rur., à l’article L. 416-8 du C. rur., à l’article L. 416-9 du C. rur., et de l’article L. 418-1 du C. rur., à l’article L. 418-5 du C. rur.\n\nToutefois, lorsque la valeur totale des biens en cause transmis par le défunt à chaque héritier, donataire ou légataire excède l’un des seuils mentionnés aux deuxième et troisième alinéas de l’article 793 bis du CGI, l’exonération partielle des droits de mutation à titre gratuit est ramenée à 50 % au-delà de cette limite.\n\nLa limite au-delà de laquelle l’exonération partielle passe de 75 % à 50 % est fixée à 600 000 € par le deuxième alinéa de l’article 793 bis du CGI. Cette limite est portée à 20 000 000 € en application du troisième alinéa de ce même article 793 bis du CGI."},"ifi.exoneration.biens-ruraux.taux-reduit":{"confirme":true,"reference":"CGI art. 975, II","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053542691","dateConsultation":"2026-08-26","note":"limite au-delà de laquelle l’exonération partielle passe de 75 % à 50 % est fixée à 600 000 € par le deuxième alinéa de l’article 793 bis du CGI. Cette limite est portée à 20 000 000 € en application du troisième alinéa de ce même article 793 bis du CGI."},"ifi.plafonnement.taux":{"confirme":true,"reference":"Article 979","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036385045/2026-10-09","dateConsultation":"","note":"L'impôt sur la fortune immobilière du redevable ayant son domicile fiscal en France est réduit de la différence entre, d'une part, le total de cet impôt et des impôts dus en France et à l'étranger au titre des revenus et produits de l'année précédente, calculés avant imputation des seuls crédits d'impôt représentatifs d'une imposition acquittée à l'étranger et des retenues non libératoires et, d'autre part, 75 % du total des revenus mondiaux nets de frais professionnels de l'année précédente."},"ifi.reduction.dons.taux":{"confirme":true,"reference":"CGI art. 978","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037988624/","dateConsultation":"2026-08-26","note":"e redevable peut imputer sur l'impôt sur la fortune immobilière, dans la limite de 50 000 €, 75 % du montant des dons en numéraire et dons en pleine propriété de titres de sociétés admis aux négociations sur un marché réglementé français ou étranger effectués au profit de certains organismes désignés dans l'article."},"ifi.residence-principale.abattement":{"confirme":true,"reference":"CGI, art. 973","url":"https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006069577/LEGISCTA000036385025/","dateConsultation":"2026-10-09","note":"Oui - Par dérogation au deuxième alinéa de l'article 761, un abattement de 30 % est effectué sur la valeur vénale réelle de l'immeuble lorsque celui-ci est occupé à titre de résidence principale par son propriétaire."},"ifi.seuil.assujettissement":{"confirme":true,"reference":"CGI, art. 977","url":"https://www.legifrance.gouv.fr/codes/id/LEGISCTA000036385039/","dateConsultation":"2026-10-09","note":"Vous devez payer l'impôt sur la fortune immobilière (IFI) si la valeur nette de ce patrimoine excède 1 300 000 €"},"cdhr.abattement.imposition-commune":{"confirme":true,"reference":"CGI, art. 224","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051200465","dateConsultation":"2026-10-09","note":"Le montant résultant de la somme de l’impôt sur le revenu (IR1) et de la contribution exceptionnelle sur les hauts revenus (CEHR1), tels que définis au IV de l’article 224 du CGI, ainsi que des prélèvements libératoires de l’impôt est majoré de 12 500 € pour les contribuables soumis à une imposition commune (MAJCOUPLE).\n\nCDHR = [(RREF X 20 %) - décote] - [IR1 + CEHR1 + PREL1 + MAJPAC + MAJCOUPLE]"},"cdhr.abattement.personne-a-charge":{"confirme":true,"reference":"CGI, art. 224","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051200465","dateConsultation":"2026-10-09","note":"Le montant résultant de la somme de l’impôt sur le revenu (IR1) et de la contribution exceptionnelle sur les hauts revenus (CEHR1), tels que définis au IV de l’article 224 du CGI, ainsi que des prélèvements libératoires de l’impôt est majoré de 1 500 € par personne à charge au sens de l’article 196 du CGI, de l’article 196 A bis du CGI et de l’article 196 B du CGI (MAJPAC)\n\nCDHR = [(RREF X 20 %) - décote] - [IR1 + CEHR1 + PREL1 + MAJPAC + MAJCOUPLE]"},"cdhr.decote.borne-haute.celibataire":{"confirme":true,"reference":"CGI, art. 224","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051200465","dateConsultation":"2026-10-09","note":"Le montant résultant de l’application d’un taux de 20 % au revenu de référence retraité (RFRR) diminué d’une décote lorsque ce revenu de référence est inférieur ou égal à 330 000 € pour les contribuables célibataires,"},"cdhr.decote.borne-haute.couple":{"confirme":true,"reference":"CGI, art. 224","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051200465","dateConsultation":"2026-10-09","note":"Le montant résultant de l’application d’un taux de 20 % au revenu de référence retraité (RFRR) diminué d’une décote lorsque ce revenu de référence est inférieur ou égal à 660 000 € pour les contribuables soumis à une imposition commune."},"cdhr.decote.coefficient":{"confirme":true,"reference":"CGI, art. 224","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051200465","dateConsultation":"2026-10-09","note":"Ainsi, le montant résultant de l’application du taux de 20 % au revenu de référence est diminué de la différence, lorsqu’elle est positive, entre ce montant et 82,5 % de la différence entre ce revenu et 250 000 € pour les contribuables célibataires, veufs, séparés ou divorcés ou 500 000 € pour les contribuables soumis à une imposition commune.\n\nLe montant de la décote est calculé selon la formule suivante :\n\npour les contribuables célibataires, veufs, séparés ou divorcés : \nDécote = [RREF X 20 %] - [(RREF - 250 000 €) X 82,5 %] si > 0 ;\n\npour les contribuables soumis à une imposition commune :\nDécote = [RFRR x 20 %] - [(RFRR - 500 000 €) X 82,5 %] si > 0."},"cdhr.seuil.celibataire":{"confirme":true,"reference":"CGI, art. 224","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051200465","dateConsultation":"2026-10-09","note":"La contribution s’applique lorsque le montant du RFRR est supérieur à 250 000 € pour les contribuables célibataires, veufs, séparés ou divorcés."},"cdhr.seuil.couple":{"confirme":true,"reference":"CGI, art. 224","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051200465","dateConsultation":"2026-10-09","note":"La contribution s’applique lorsque le montant du RFRR est supérieur à 500 000 € pour les contribuables soumis à une imposition commune."},"cdhr.taux.cible":{"confirme":true,"reference":"CGI, art. 224","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051200465","dateConsultation":"2026-10-09"},"cehr.bareme.celibataire":{"confirme":true,"reference":"CGI, art. 223 sexies","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036427364","dateConsultation":"2026-10-09","note":"Oui, 500 000€ à 3%, puis 500 001 à 4%"},"cehr.bareme.couple":{"confirme":true,"reference":"CGI, art. 223 sexies","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036427364","dateConsultation":"2026-10-09","note":"Oui, 1 000 000€ à 3%, puis 1 000 001 à 4%"},"ir.abattement.pensions.plafond":{"confirme":true,"reference":"CGI, art. 158","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051765203","dateConsultation":"2026-10-09","note":"4 439€ pour l'ensemble du foyer et non par déclarant."},"ir.abattement.pensions.plancher":{"confirme":true,"reference":"CGI, art. 158","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051765203","dateConsultation":"2026-10-09","note":"Oui montant minimal de 442€ pour l'ensemble du foyer et non par déclarant."},"ir.abattement.pensions.taux":{"confirme":true,"reference":"CGI, art. 158","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051765203","dateConsultation":"2026-10-09","note":"Montant de 10% dans la limite de 4 439€ par foyer."},"ir.abattement.salaires.plafond":{"confirme":true,"reference":"CGI, art. 83","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032701943/2026-10-09","dateConsultation":"2026-10-09","note":"14 555€ par déclarant et non par foyer."},"ir.abattement.salaires.taux":{"confirme":true,"reference":"CGI, art. 83","url":"https://www.legifrance.gouv.fr/codes/article_l axe vaut le taux appliqué à la plus-value, diminué du lissage multiplié par ce qui manque pour atteindre le plafond. Un lissage nul signifie un palier plat.","statut":"cite","reference":"CGI art. 1609 nonies G · BOI-RFPI-TPVIE-20","url":"","dateConsultation":"2026-08-26","question":"Votre remarque décrit une règle de calcul (cession par plusieurs personnes dont des non-résidents : montant net après abattement imposable en France), pas une source. Souhaitez-vous qu’elle devienne un point à vérifier dans le simulateur, ou la considérez-vous hors périmètre ?"},{"id":"pv-immobiliere.taux.impot-revenu","libelle":"Taux d’imposition à l’impôt sur le revenu de la plus-value immobilière","millesime":2026,"valeur":"0.19","utilisePar":["pv-immobiliere"],"notes":"","statut":"inconnue","reference":"","url":"","dateConsultation":"","question":"La date de vérification manque. Sans elle, la source ne peut pas être reportée dans les référentiels du dépôt (une source sans date de consultation y est refusée). Indiquez-la ci-dessus."}]}]</script>

<script id="app-js">
(function () {
  "use strict";

  var DOMAINES = JSON.parse(document.getElementById("data-sources").textContent);
  var CLE_BROUILLON = "sources-fiscales-brouillon";

  var etat = lireEtat();
  var artifact = null;
  var capacite = "attente";
  var enAttente = false;
  var ouvertes = {};

  function toutesEntrees() {
    var l = [];
    DOMAINES.forEach(function (d) { d.entrees.forEach(function (e) { l.push(e); }); });
    return l;
  }

  function ech(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function fmtNombre(n) { return Number(n).toLocaleString("fr-FR"); }

  function fmtTaux(n) {
    var pct = Math.round(Number(n) * 100 * 1000) / 1000;
    return pct.toLocaleString("fr-FR", { maximumFractionDigits: 3 }) + " %";
  }

  function estTranches(v) {
    return /^\d+-(\d+|infini)\s*@\s*-?[\d.]+(\s*;\s*\d+-(\d+|infini)\s*@\s*-?[\d.]+)*$/.test(v);
  }

  function trancheHtml(v) {
    var lignes = v.split(";").map(function (seg) {
      var m = seg.trim().match(/^(\d+)-(\d+|infini)\s*@\s*(-?[\d.]+)$/);
      if (!m) return null;
      var min = fmtNombre(m[1]);
      var max = m[2] === "infini" ? "∞" : fmtNombre(m[2]);
      return "<tr><td>" + ech(min) + "</td><td>" + ech(max) + "</td><td class=\"taux\">" + ech(fmtTaux(m[3])) + "</td></tr>";
    });
    if (lignes.indexOf(null) !== -1) return null;
    return '<div class="tranches-zone"><table class="tranches"><thead><tr><th>De</th><th>à</th><th>Taux</th></tr></thead><tbody>' + lignes.join("") + "</tbody></table></div>";
  }

  function paliersHtml(v) {
    var arr;
    try { arr = JSON.parse(v); } catch (e) { return null; }
    if (!Array.isArray(arr) || !arr.length) return null;
    var lignes = arr.map(function (p) {
      if (!p || typeof p !== "object" || p.taux === undefined) return null;
      var plafond = (p.plafond === null || p.plafond === undefined) ? "∞" : fmtNombre(p.plafond);
      var lissage = p.lissage !== undefined ? fmtTaux(p.lissage) : "—";
      return "<tr><td>" + ech(plafond) + "</td><td class=\"taux\">" + ech(fmtTaux(p.taux)) + "</td><td>" + ech(lissage) + "</td></tr>";
    });
    if (lignes.indexOf(null) !== -1) return null;
    return '<div class="tranches-zone"><table class="tranches"><thead><tr><th>Jusqu’à</th><th>Taux</th><th>Lissage</th></tr></thead><tbody>' + lignes.join("") + "</tbody></table></div>";
  }

  function resumeValeur(entree) {
    var v = String(entree.valeur).trim();
    if (v === "True") return "Oui";
    if (v === "False") return "Non";
    if (/^\[.*\]$/.test(v)) {
      try {
        var arr = JSON.parse(v);
        if (Array.isArray(arr)) return arr.length + " palier" + (arr.length > 1 ? "s" : "");
      } catch (e) {}
    }
    if (estTranches(v)) {
      var segments = v.split(";");
      if (segments.length === 1) {
        var mUnique = segments[0].trim().match(/@\s*(-?[\d.]+)$/);
        if (mUnique) return fmtTaux(mUnique[1]);
      }
      return segments.length + " tranches";
    }
    if (/^\d+\.\d+$/.test(v) && parseFloat(v) < 1) return fmtTaux(v);
    if (/^\d+$/.test(v)) return fmtNombre(v);
    return entree.valeur;
  }

  function detailValeurHtml(entree) {
    var v = String(entree.valeur).trim();
    if (/^\[.*\]$/.test(v)) return paliersHtml(v);
    if (estTranches(v)) return trancheHtml(v);
    return null;
  }

  function reponseDe(id) { return etat.reponses[id] || {}; }

  function estConfirmee(id) { return !!reponseDe(id).confirme; }

  function entreeParId(id) {
    var trouve = null;
    DOMAINES.forEach(function (d) { d.entrees.forEach(function (e) { if (e.id === id) trouve = e; }); });
    return trouve;
  }

  function etatEntree(entree) {
    if (estConfirmee(entree.id)) return "confirmee";
    var r = reponseDe(entree.id);
    var ref = (r.reference !== undefined ? r.reference : entree.reference) || "";
    if (ref.trim()) return "cite";
    return "inconnue";
  }

  function nbConfirmees() { return toutesEntrees().filter(function (e) { return estConfirmee(e.id); }).length; }
  function nbParEtat(etatCherche) { return toutesEntrees().filter(function (e) { return etatEntree(e) === etatCherche; }).length; }
  function nbConfirmeesDomaine(d) { return d.entrees.filter(function (e) { return estConfirmee(e.id); }).length; }

  function ecrireBrouillon() {
    try { localStorage.setItem(CLE_BROUILLON, JSON.stringify(etat.reponses)); } catch (e) {}
  }
  function effacerBrouillon() {
    try { localStorage.removeItem(CLE_BROUILLON); } catch (e) {}
  }
  function appliquerBrouillon() {
    var brut;
    try { brut = localStorage.getItem(CLE_BROUILLON); } catch (e) { return false; }
    if (!brut) return false;
    var local;
    try { local = JSON.parse(brut); } catch (e) { return false; }
    var change = false;
    Object.keys(local || {}).forEach(function (id) {
      var a = JSON.stringify(etat.reponses[id] || null);
      var b = JSON.stringify(local[id]);
      if (a !== b) { etat.reponses[id] = local[id]; change = true; }
    });
    return change;
  }

  function lireEtat() {
    try {
      var brut = document.getElementById("etat").textContent;
      var lu = JSON.parse(brut);
      return { reponses: lu.reponses || {}, maj: lu.maj || null };
    } catch (e) {
      return { reponses: {}, maj: null };
    }
  }

  function entreeHtml(entree) {
    var r = reponseDe(entree.id);
    var etatE = etatEntree(entree);
    var ref = r.reference !== undefined ? r.reference : entree.reference;
    var url = r.url !== undefined ? r.url : entree.url;
    var date = r.dateConsultation !== undefined ? r.dateConsultation : entree.dateConsultation;
    var note = r.note !== undefined ? r.note : "";
    var reponse = r.reponse !== undefined ? r.reponse : "";
    var ouverte = !!ouvertes[entree.id];

    var libelleBadge = etatE === "confirmee" ? "Confirmée" : etatE === "cite" ? "À confirmer" : "Inconnue";

    var h = '<div class="entree" id="e-' + ech(entree.id) + '" data-etat="' + etatE + '" data-ouverte="' + (ouverte ? "1" : "0") + '">';

    h += '<button type="button" class="entree-tete" data-toggle="' + ech(entree.id) + '" aria-expanded="' + (ouverte ? "true" : "false") + '">';
    h += '<div class="entree-info">';
    h += '<div class="entree-id">' + ech(entree.id) + " · millésime " + ech(entree.millesime) + "</div>";
    h += '<div class="entree-libelle">' + ech(entree.libelle) + "</div>";
    h += '<div class="entree-valeur">' + ech(resumeValeur(entree)) + "</div>";
    if (entree.utilisePar && entree.utilisePar.length) {
      h += '<div class="entree-utilise">Employé par : ' + ech(entree.utilisePar.join(", ")) + "</div>";
    }
    h += "</div>";
    h += '<div class="entree-droite">';
    if (entree.question) h += '<span class="entree-badge" data-etat="question">À clarifier</span>';
    h += '<span class="entree-badge" data-etat="' + etatE + '">' + libelleBadge + "</span>";
    h += '<span class="chevron" aria-hidden="true"></span>';
    h += "</div>";
    h += "</button>";

    h += '<div class="entree-corps">';
    var detailValeur = detailValeurHtml(entree);
    if (detailValeur) h += detailValeur;
    if (entree.notes) h += '<div class="entree-note">' + ech(entree.notes) + "</div>";
    if (entree.question) {
      h += '<div class="entree-question"><b>Point à clarifier</b>' + ech(entree.question) + "</div>";
      h += '<div class="champ"><label>Votre réponse</label><textarea data-id="' + ech(entree.id) + '" data-champ="reponse" placeholder="Réponse au point ci-dessus">' + ech(reponse) + "</textarea></div>";
    }

    h += '<div class="champs">';
    h += '<div class="champ"><label>Référence légale</label><input type="text" data-id="' + ech(entree.id) + '" data-champ="reference" placeholder="ex. CGI art. 197, I, 4" value="' + ech(ref) + '"></div>';
    h += '<div class="champ"><label>Lien (si disponible)</label><input type="text" data-id="' + ech(entree.id) + '" data-champ="url" placeholder="legifrance.gouv.fr/…" value="' + ech(url) + '"></div>';
    h += '<div class="champ"><label>Vérifié le</label><input type="date" data-id="' + ech(entree.id) + '" data-champ="dateConsultation" value="' + ech(date) + '"></div>';
    h += "</div>";

    h += '<div class="champ"><label>Remarque (montant à corriger, doute, etc.)</label><textarea data-id="' + ech(entree.id) + '" data-champ="note" placeholder="Laisser vide si rien à signaler">' + ech(note) + "</textarea></div>";

    h += '<label class="confirme-ligne"><input type="checkbox" data-id="' + ech(entree.id) + '" data-champ="confirme"' + (estConfirmee(entree.id) ? " checked" : "") + '> Je confirme que la référence et le montant ci-dessus sont exacts</label>';

    h += "</div></div>";
    return h;
  }

  function suiteHtml() {
    var aClarifier = toutesEntrees().filter(function (e) { return e.question; });
    var h = '<section class="suite" id="suite"><h2>Suite donnée à vos saisies (9 octobre 2026)</h2>';
    h += "<p>Vos références, liens et dates ont été reportés dans les données du dépôt pour les valeurs confirmées dont la date de vérification est renseignée. Aucun montant n'a été modifié, et aucune valeur n'est encore passée au statut « validée » : ce statut suppose aussi une date d'effet connue.</p>";
    h += "<p>Les montants sont ceux du simulateur, au millésime indiqué sur chaque fiche. Lorsque le texte que vous avez consulté donne un montant différent, la fiche le signale ci-dessous.</p>";
    h += "<p><b>" + aClarifier.length + " fiches portent un point à clarifier.</b> Cliquez pour l'ouvrir et répondre dans le champ prévu.</p><ul>";
    aClarifier.forEach(function (e) {
      h += '<li><button type="button" class="suite-lien" data-vers-entree="' + ech(e.id) + '">' + ech(e.libelle) + "<span>" + ech(e.id) + "</span></button></li>";
    });
    h += "</ul></section>";
    return h;
  }

  function domaineHtml(d) {
    var h = '<section class="domaine" id="d-' + ech(d.domaine) + '">';
    h += '<div class="domaine-tete"><h2>' + ech(d.libelleDomaine) + "</h2>";
    h += '<span class="domaine-compte">' + nbConfirmeesDomaine(d) + " / " + d.entrees.length + " confirmées</span></div>";
    d.entrees.forEach(function (e) { h += entreeHtml(e); });
    h += "</section>";
    return h;
  }

  function railHtml() {
    var h = "";
    DOMAINES.forEach(function (d, i) {
      var n = nbConfirmeesDomaine(d);
      var part = d.entrees.length ? Math.round((n / d.entrees.length) * 100) : 0;
      h += '<button class="rail-lien" type="button" data-vers="' + ech(d.domaine) + '" data-actif="' + (i === 0 ? "1" : "0") + '">';
      h += '<span class="rail-titre"><b>' + ech(d.libelleDomaine) + '</b><span class="rail-compte">' + n + "/" + d.entrees.length + "</span></span>";
      h += '<span class="rail-piste"><span class="rail-part" style="width:' + part + '%"></span></span>';
      h += "</button>";
    });
    return h;
  }

  function rendre() {
    var h = "";

    h += '<header class="bandeau"><div class="bandeau-corps">';
    h += '<div class="marque"><span class="marque-nom">Sources fiscales</span><span class="marque-sous">simulateurs Arthur Beldi</span></div>';
    h += '<div class="jauge"><div class="jauge-piste" id="jauge"></div>';
    h += '<div class="jauge-txt" id="jauge-txt"></div></div>';
    h += "</div></header>";

    h += '<div class="corps">';

    h += '<nav class="rail" id="rail">' + railHtml() + "</nav>";

    h += '<main class="colonne">';

    h += '<div class="intro">';
    h += "<h1>D'où viennent ces chiffres ?</h1>";
    h += "<p>Chaque simulateur applique des barèmes, seuils et abattements. Le code ne dit pas toujours d'où ils viennent. Cette page les liste tous : pour chacun, indiquez l'article de loi ou le texte qui le fixe, un lien si vous en avez un, et la date où vous l'avez vérifié.</p>";
    h += "<p>Certains ont déjà une référence trouvée dans le code — ouvrez la fiche, cochez la case si elle est juste ou corrigez-la. Les autres n'ont rien : à vous de les trouver. Cliquez sur une ligne pour l'ouvrir.</p>";
    h += '<div class="legende">';
    h += '<span><span class="pastille" data-etat="inconnue"></span>Source inconnue</span>';
    h += '<span><span class="pastille" data-etat="cite"></span>Référence trouvée, à confirmer</span>';
    h += '<span><span class="pastille" data-etat="confirmee"></span>Confirmée</span>';
    h += "</div></div>";

    h += suiteHtml();

    h += '<div class="commandes">';
    h += '<button class="btn" type="button" id="tout-deplier">Tout déplier</button>';
    h += '<button class="btn" type="button" id="tout-replier">Tout replier</button>';
    h += "</div>";

    DOMAINES.forEach(function (d) { h += domaineHtml(d); });

    h += '<footer class="pied">';
    h += "<div>Cette page ne certifie rien toute seule : vos confirmations renseignent la source de chaque valeur dans les données du dépôt. Le statut « validée » d'une valeur suppose en outre une date d'effet connue et, le cas échéant, vos réponses aux points à clarifier.</div>";
    h += '<div class="mot" id="mot-pied"></div>';
    h += "</footer>";

    h += "</main></div>";

    h += '<div class="barre" id="barre" hidden>';
    h += '<span class="barre-txt" id="barre-txt"></span>';
    h += '<button class="btn btn-fort" type="button" id="enregistrer">Enregistrer</button>';
    h += "</div>";

    document.getElementById("app").innerHTML = h;
    majJauge();
    brancher();
    brancherScrollSpy();
  }

  function majJauge() {
    var total = toutesEntrees().length;
    var confirmees = nbConfirmees();
    var citees = nbParEtat("cite");
    var j = document.getElementById("jauge");
    if (j) {
      j.innerHTML = "";
      if (citees) {
        var seg1 = document.createElement("div");
        seg1.className = "jauge-seg";
        seg1.dataset.etat = "cite";
        seg1.style.width = (total ? (citees / total) * 100 : 0) + "%";
        j.appendChild(seg1);
      }
      if (confirmees) {
        var seg2 = document.createElement("div");
        seg2.className = "jauge-seg";
        seg2.dataset.etat = "confirmee";
        seg2.style.width = (total ? (confirmees / total) * 100 : 0) + "%";
        j.appendChild(seg2);
      }
    }
    var t = document.getElementById("jauge-txt");
    if (t) t.textContent = confirmees + " / " + total + " confirmée" + (confirmees > 1 ? "s" : "");
  }

  function majEtatVisuel(id) {
    var entree = entreeParId(id);
    if (!entree) return;
    var etatE = etatEntree(entree);
    var noeud = document.getElementById("e-" + id);
    if (noeud) {
      noeud.dataset.etat = etatE;
      var badge = noeud.querySelector(".entree-badge");
      if (badge) {
        badge.dataset.etat = etatE;
        badge.textContent = etatE === "confirmee" ? "Confirmée" : etatE === "cite" ? "À confirmer" : "Inconnue";
      }
    }
    majCompteDomaine(domaineDe(id));
    majJauge();
  }

  function majCompteDomaine(domaineId) {
    var d = null;
    DOMAINES.forEach(function (dd) { if (dd.domaine === domaineId) d = dd; });
    if (!d) return;
    var n = nbConfirmeesDomaine(d);
    var el = document.querySelector('#d-' + domaineId + ' .domaine-compte');
    if (el) el.textContent = n + " / " + d.entrees.length + " confirmées";
    var railBtn = document.querySelector('.rail-lien[data-vers="' + domaineId + '"]');
    if (railBtn) {
      var compte = railBtn.querySelector(".rail-compte");
      if (compte) compte.textContent = n + "/" + d.entrees.length;
      var part = railBtn.querySelector(".rail-part");
      if (part) part.style.width = (d.entrees.length ? (n / d.entrees.length) * 100 : 0) + "%";
    }
  }

  function domaineDe(id) {
    var trouve = null;
    DOMAINES.forEach(function (d) { d.entrees.forEach(function (e) { if (e.id === id) trouve = d.domaine; }); });
    return trouve;
  }

  function marquerModifie() {
    enAttente = true;
    ecrireBrouillon();
    rafraichirBarre();
  }

  function rafraichirBarre() {
    var barre = document.getElementById("barre");
    if (!barre || !enAttente) return;
    var txt = document.getElementById("barre-txt");
    var bouton = document.getElementById("enregistrer");
    bouton.disabled = false;
    if (capacite === "oui") {
      txt.textContent = "Modifications non enregistrées";
      bouton.textContent = "Enregistrer";
    } else if (capacite === "non") {
      txt.textContent = "Vos réponses restent sur cet appareil";
      bouton.textContent = "Copier mes réponses";
    } else {
      txt.textContent = "Vérification en cours";
      bouton.textContent = "Enregistrer";
      bouton.disabled = true;
    }
    barre.hidden = false;
  }

  function brancherEntree(racine) {
    racine.querySelectorAll("input[data-champ], textarea[data-champ]").forEach(function (el) {
      var evt = el.type === "checkbox" ? "change" : "input";
      el.addEventListener(evt, function () {
        var id = el.dataset.id;
        var r = etat.reponses[id] || {};
        if (el.dataset.champ === "confirme") r.confirme = el.checked;
        else r[el.dataset.champ] = el.value;
        etat.reponses[id] = r;
        majEtatVisuel(id);
        marquerModifie();
      });
    });
  }

  function ouvrir(id, ouverte) {
    ouvertes[id] = ouverte;
    var noeud = document.getElementById("e-" + id);
    if (!noeud) return;
    noeud.dataset.ouverte = ouverte ? "1" : "0";
    var bouton = noeud.querySelector(".entree-tete");
    if (bouton) bouton.setAttribute("aria-expanded", ouverte ? "true" : "false");
  }

  function brancher() {
    document.querySelectorAll(".entree").forEach(function (el) { brancherEntree(el); });

    document.querySelectorAll("[data-toggle]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.toggle;
        ouvrir(id, !ouvertes[id]);
      });
    });

    document.querySelectorAll(".rail-lien").forEach(function (b) {
      b.addEventListener("click", function () {
        var cible = document.getElementById("d-" + b.dataset.vers);
        if (cible) cible.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    document.querySelectorAll("[data-vers-entree]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.dataset.versEntree;
        ouvrir(id, true);
        var cible = document.getElementById("e-" + id);
        if (cible) cible.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });

    var deplier = document.getElementById("tout-deplier");
    if (deplier) deplier.addEventListener("click", function () {
      toutesEntrees().forEach(function (e) { ouvrir(e.id, true); });
    });
    var replier = document.getElementById("tout-replier");
    if (replier) replier.addEventListener("click", function () {
      toutesEntrees().forEach(function (e) { ouvrir(e.id, false); });
    });

    var enr = document.getElementById("enregistrer");
    if (enr) enr.addEventListener("click", function () {
      if (capacite === "oui") enregistrer(); else copierReponses();
    });
  }

  function brancherScrollSpy() {
    if (!("IntersectionObserver" in window)) return;
    var sections = DOMAINES.map(function (d) { return document.getElementById("d-" + d.domaine); }).filter(Boolean);
    if (!sections.length) return;
    var obs = new IntersectionObserver(function (entrees) {
      entrees.forEach(function (entree) {
        if (!entree.isIntersecting) return;
        var domaineId = entree.target.id.replace(/^d-/, "");
        document.querySelectorAll(".rail-lien").forEach(function (b) {
          b.dataset.actif = b.dataset.vers === domaineId ? "1" : "0";
        });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    sections.forEach(function (s) { obs.observe(s); });
  }

  function dire(message, ton) {
    var m = document.getElementById("mot-pied");
    if (!m) return;
    m.textContent = message;
    if (ton) m.setAttribute("data-ton", ton); else m.removeAttribute("data-ton");
  }

  function synthese() {
    var l = ["# Sources fiscales renseignées", ""];
    if (etat.maj) l.push("Dernier enregistrement : " + etat.maj, "");
    DOMAINES.forEach(function (d) {
      var faites = d.entrees.filter(function (e) { return estConfirmee(e.id) || (reponseDe(e.id).reference || "").trim() || (reponseDe(e.id).reponse || "").trim(); });
      if (!faites.length) return;
      l.push("## " + d.libelleDomaine, "");
      faites.forEach(function (e) {
        var r = reponseDe(e.id);
        var ref = r.reference !== undefined ? r.reference : e.reference;
        var url = r.url !== undefined ? r.url : e.url;
        var date = r.dateConsultation !== undefined ? r.dateConsultation : e.dateConsultation;
        l.push("### " + e.id + " — " + e.libelle);
        l.push("Confirmée : " + (estConfirmee(e.id) ? "oui" : "non"));
        if (ref) l.push("Référence : " + ref);
        if (url) l.push("Lien : " + url);
        if (date) l.push("Vérifié le : " + date);
        if (r.note && r.note.trim()) l.push("Remarque : " + r.note.trim());
        if (r.reponse && r.reponse.trim()) l.push("Réponse : " + r.reponse.trim());
        l.push("");
      });
    });
    return l.join("\n");
  }

  function copierReponses() {
    var texte = synthese();
    var txt = document.getElementById("barre-txt");
    if (!navigator.clipboard || !navigator.clipboard.writeText) {
      txt.textContent = "Copie indisponible dans ce navigateur";
      return;
    }
    navigator.clipboard.writeText(texte).then(function () {
      txt.textContent = "Réponses copiées, collez-les dans votre message";
    }, function () {
      txt.textContent = "La copie a échoué";
    });
  }

  function documentPublie() {
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("app-js").textContent;
    var data = document.getElementById("data-sources").textContent;
    etat.maj = new Date().toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" });
    var json = JSON.stringify({ reponses: etat.reponses, maj: etat.maj });
    return [
      "<!doctype html>",
      '<html lang="fr"><head><meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      "<title>Sources fiscales à renseigner</title>",
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">',
      "<style id=\"css\">" + css + "</style>",
      "</head><body>",
      '<div id="app"></div>',
      '<script id="etat" type="application/json">' + json + "<\/script>",
      '<script id="data-sources" type="application/json">' + data + "<\/script>",
      '<script id="app-js">' + js + "<\/script>",
      "</body></html>"
    ].join("\n");
  }

  function enregistrer() {
    if (!artifact) { dire("Cette vue ne permet pas d'enregistrer.", "stop"); return; }
    var bouton = document.getElementById("enregistrer");
    bouton.disabled = true;
    document.getElementById("barre-txt").textContent = "Enregistrement…";
    artifact.publish(documentPublie()).then(function () {
      enAttente = false;
      effacerBrouillon();
      document.getElementById("barre").hidden = true;
    }, function (err) {
      var code = err && err.code;
      if (code === "conflict") {
        document.getElementById("barre-txt").textContent = "Quelqu'un a enregistré avant vous, la page se recharge";
      } else if (code === "not_granted" || code === "not_writer") {
        document.getElementById("barre-txt").textContent = "Vous consultez cette page en lecture seule";
      } else {
        document.getElementById("barre-txt").textContent = "Enregistrement impossible, réessayez";
        bouton.disabled = false;
      }
    });
  }

  var brouillonRestaure = appliquerBrouillon();

  rendre();

  if (brouillonRestaure) {
    enAttente = true;
    rafraichirBarre();
  }

  window.addEventListener("beforeunload", function (e) {
    if (enAttente && capacite === "oui") { e.preventDefault(); e.returnValue = ""; }
  });

  if (!window.claude || !window.claude.use) {
    capacite = "non";
    rafraichirBarre();
  }

  if (window.claude && window.claude.use) {
    claude.use("artifact").then(function (a) {
      artifact = a;
      capacite = a ? "oui" : "non";
      rafraichirBarre();
    });
  }
})();
</script>
