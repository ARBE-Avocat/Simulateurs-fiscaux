  --surface-2: #f7f9fa;
  --ink: #15202b;
  --ink-soft: #55636f;
  --ink-faint: #8a97a2;
  --rule: #dbe2e8;
  --rule-strong: #c3cdd6;
  --accent: #1f4e79;
  --accent-ink: #ffffff;
  --accent-soft: #e7eef6;
  --ok: #2c6a4e;
  --ok-soft: #e4efe9;
  --warn: #85601a;
  --warn-soft: #f6eeda;
  --stop: #93332f;
  --stop-soft: #f7e6e4;
  --shadow: 0 1px 2px rgba(21, 32, 43, .06), 0 8px 24px -16px rgba(21, 32, 43, .3);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {

    --surface: #181f26;
    --surface-2: #1e262e;
    --ink: #e7ecf0;
    --ink-soft: #9daab5;
    --ink-faint: #6d7b87;
    --rule: #2a333c;
    --rule-strong: #3a4650;
    --accent: #82b2e2;
    --accent-ink: #0e1620;
    --accent-soft: #1a2836;
    --ok: #74bb97;
    --ok-soft: #172921;
    --warn: #d6a751;
    --warn-soft: #2b2417;
    --stop: #e28a85;
    --stop-soft: #2d1c1b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }
}

:root[data-theme="dark"] {
  --ground: #11161b;
  --surface: #181f26;
  --surface-2: #1e262e;
  --ink: #e7ecf0;
  --ink-soft: #9daab5;
  --ink-faint: #6d7b87;
  --rule: #2a333c;
  --rule-strong: #3a4650;
  --accent: #82b2e2;
  --accent-ink: #0e1620;
  --accent-soft: #1a2836;
  --ok: #74bb97;
  --ok-soft: #172921;
  --warn: #d6a751;
  --warn-soft: #2b2417;
  --stop: #e28a85;
  --stop-soft: #2d1c1b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- Bandeau ---------- */

.bandeau {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.bandeau-corps {
  max-width: 1180px;
  margin: 0 auto;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.marque {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.01em;
  margin-right: auto;
}

.marque span { color: var(--ink-faint); font-weight: 400; }

.jauge { display: flex; align-items: center; gap: 12px; }

.jauge-piste {
  width: 132px;
  height: 6px;
  border-radius: 99px;
  background: var(--rule);
  overflow: hidden;
}

.jauge-part { height: 100%; background: var(--accent); width: 0; transition: width .35s ease; }

.jauge-txt {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---------- Boutons ---------- */

.btn {
  font: inherit;
  font-size: 13.5px;
  font-weight: 500;
  padding: 8px 15px;
  border-radius: 7px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}

.btn:hover { background: var(--surface-2); border-color: var(--ink-faint); }
.btn-fort { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-fort:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.1); }
.btn:disabled { opacity: .45; cursor: default; }

:where(button, a, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- Ossature ---------- */

.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 40px 28px 96px;
  display: grid;
  grid-template-columns: 246px minmax(0, 1fr);
  gap: 44px;
  align-items: start;
}

/* ---------- Sommaire ---------- */

.sommaire { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 3px; }

.sommaire-titre {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 0 0 10px;
}

.som-lien {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: 6px;
  text-decoration: none;
  color: var(--ink-soft);
  font-size: 13.5px;
  line-height: 1.35;
  border: none;
  background: none;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  width: 100%;
}

.som-lien:hover { background: var(--surface); color: var(--ink); }

.pastille {
  width: 8px;
  height: 8px;
  border-radius: 99px;
  flex: 0 0 auto;
  background: var(--rule-strong);
}

.pastille[data-etat="repondu"] { background: var(--ok); }
.som-ref { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); flex: 0 0 auto; }

/* ---------- Marche à suivre ---------- */

.mode-emploi {
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  background: var(--surface);
  border-radius: 0 10px 10px 0;
  padding: 16px 22px 17px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.mode-emploi ol {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 26px;
}

.mode-emploi li {
  display: flex;
  align-items: baseline;
  gap: 9px;
  font-size: 14.5px;
  flex: 1 1 240px;
}

.me-num {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 1px 6px;
  flex: 0 0 auto;
}

.me-note { margin: 0; font-size: 13.5px; color: var(--ink-soft); }

/* ---------- Sections ---------- */

.flux { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
.groupe { display: flex; flex-direction: column; gap: 18px; }

.groupe-tete { display: flex; flex-direction: column; gap: 6px; }

.groupe-tete h2 {
  font-family: var(--serif);
  font-size: 25px;
  font-weight: 600;
  letter-spacing: -.015em;
}

.groupe-tete p { margin: 0; color: var(--ink-soft); font-size: 14.5px; max-width: 60ch; }

.etiquette {
  align-self: flex-start;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 5px;
}

.etiquette[data-ton="action"] { background: var(--accent-soft); color: var(--accent); }
.etiquette[data-ton="stop"] { background: var(--stop-soft); color: var(--stop); }
.etiquette[data-ton="warn"] { background: var(--warn-soft); color: var(--warn); }
.etiquette[data-ton="calme"] { background: var(--surface-2); color: var(--ink-faint); }

/* ---------- Fiche ---------- */

.fiche {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 11px;
  box-shadow: var(--shadow);
  overflow: hidden;
  scroll-margin-top: 86px;
}

.fiche[data-bloquant="oui"] { border-color: var(--stop); }

/* Une fiche arbitrée se réduit à son titre : elle reste consultable, sans
   encombrer la lecture de ce qui reste à trancher. */
.fiche.reduite { background: var(--surface-2); }
.fiche.reduite[data-bloquant="oui"] { border-color: var(--rule); }

.replier {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 22px;
  background: none;
  border: none;
  font: inherit;
  color: inherit;
  cursor: pointer;
  text-align: left;
}

.replier:hover { background: var(--surface); }

.replier .fiche-ref { padding-top: 0; }

.replier-titre {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -.01em;
  margin-right: auto;
  min-width: 0;
}

.resolu {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ok);
  background: var(--ok-soft);
  border-radius: 5px;
  padding: 4px 9px;
}

.resolu::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 99px;
  background: currentColor;
}

.resolu-detail {
  flex: 0 1 auto;
  font-size: 13px;
  color: var(--ink-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chevron { flex: 0 0 auto; color: var(--ink-faint); font-size: 12px; }

@media (max-width: 700px) { .resolu-detail { display: none; } }

.fiche-tete {
  display: flex;
  gap: 14px;
  align-items: baseline;
  padding: 20px 24px 0;
}

.fiche-ref {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink-faint);
  padding-top: 4px;
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
}

.fiche-tete h3 {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -.01em;
}

.fiche-sim {
  display: inline-block;
  margin-left: 10px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-faint);
  vertical-align: middle;
}

.fiche-corps { padding: 14px 24px 22px; display: flex; flex-direction: column; gap: 15px; }
.fiche-corps p { margin: 0; }
.fiche-corps p.doux, p.doux { color: var(--ink-soft); }

.intitule {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 5px;
}

.bloc { display: flex; flex-direction: column; }

.tableau-enveloppe { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }

th, td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
thead th { background: var(--surface-2); font-weight: 600; font-size: 12.5px; color: var(--ink-soft); }
tbody tr:last-child td { border-bottom: none; }
td.chiffre, th.chiffre { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.avant { color: var(--stop); }
td.apres { color: var(--ok); }
tr.marque-ligne td { font-weight: 600; }

.encart {
  border-left: 3px solid var(--warn);
  background: var(--warn-soft);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  font-size: 14.5px;
}

.encart strong { font-weight: 600; }

/* ---------- Réponse ---------- */

.reponse {
  border-top: 1px solid var(--rule);
  background: var(--surface-2);
  padding: 18px 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.choix { display: flex; flex-wrap: wrap; gap: 9px; }

.choix button {
  font: inherit;
  font-size: 13.5px;
  padding: 9px 14px;
  border-radius: 7px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: border-color .15s ease, background .15s ease;
}

.choix button:hover { border-color: var(--ink-faint); }

.choix button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.choix button[aria-pressed="true"][data-ton="ok"] { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.choix button[aria-pressed="true"][data-ton="stop"] { border-color: var(--stop); background: var(--stop-soft); color: var(--stop); }

.puce { width: 7px; height: 7px; border-radius: 99px; background: currentColor; opacity: .55; flex: 0 0 auto; }
.choix button[aria-pressed="true"] .puce { opacity: 1; }

textarea {
  font: inherit;
  font-size: 14.5px;
  width: 100%;
  min-height: 62px;
  resize: vertical;
  padding: 11px 13px;
  border-radius: 8px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink);
}

textarea::placeholder { color: var(--ink-faint); }

.sous-q {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 12px 15px;
  border: 1px dashed var(--rule-strong);
  border-radius: 8px;
}

.sous-q p { margin: 0; font-size: 14.5px; }

/* ---------- Barre d'enregistrement ---------- */

.barre {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 22px;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 14px 11px 20px;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 12px;
  box-shadow: var(--shadow);
  max-width: calc(100vw - 32px);
}

.barre[hidden] { display: none; }
.barre-txt { font-size: 13.5px; color: var(--ink-soft); }

.mot {
  font-size: 13px;
  color: var(--ink-soft);
  padding: 6px 0;
  min-height: 20px;
}

.mot[data-ton="ok"] { color: var(--ok); }
.mot[data-ton="stop"] { color: var(--stop); }

.pied {
  grid-column: 1 / -1;
  margin-top: 48px;
  padding-top: 26px;
  border-top: 1px solid var(--rule);
  color: var(--ink-faint);
  font-size: 13.5px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pied a { color: var(--accent); }

.actions-pied { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

@media (max-width: 980px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .sommaire { display: none; }
  .page { padding: 28px 20px 110px; }
  .bandeau-corps { padding: 12px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

  /**
   * Brouillon local, propre au navigateur du lecteur.
   * Un lecteur invité ne peut pas republier la page : sans ce filet, ses
   * réponses seraient perdues au moindre rechargement.
   */
  function ecrireBrouillon() {
    try {
      localStorage.setItem(CLE_BROUILLON, JSON.stringify(etat.reponses));
    } catch (e) { /* stockage indisponible : on continue sans filet */ }
  }

  function effacerBrouillon() {
    try { localStorage.removeItem(CLE_BROUILLON); } catch (e) { /* sans effet */ }
  }

  function appliquerBrouillon() {
    var brut;
    try { brut = localStorage.getItem(CLE_BROUILLON); } catch (e) { return false; }
    if (!brut) return false;
    var local;
    try { local = JSON.parse(brut); } catch (e) { return false; }
    var change = false;
    Object.keys(local || {}).forEach(function (ref) {
      var a = JSON.stringify(etat.reponses[ref] || null);
      var b = JSON.stringify(local[ref]);
      if (a !== b) { etat.reponses[ref] = local[ref]; change = true; }
    });
    return change;
  }

  function copierReponses() {
    var texte = synthese();
    var txt = document.getElementById("barre-txt");
    if (!navigator.clipboard || !navigator.clipboard.writeText) {
      txt.textContent = "Copie indisponible dans ce navigateur";
      return;
    }
    navigator.clipboard.writeText(texte).then(function () {
      txt.textContent = "Réponses copiées, collez-les dans votre message";
    }, function () {
      txt.textContent = "La copie a échoué";
    });
  }

  function lireEtat() {
    try {
      var brut = document.getElementById("etat").textContent;
      var lu = JSON.parse(brut);
      return { reponses: lu.reponses || {}, maj: lu.maj || null };
    } catch (e) {
      return { reponses: {}, maj: null };
    }
  }

  function ech(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function pointsDecidables() {
    return POINTS.filter(function (p) { return !p.sansDecision; });

  function estRepondu(p) {
    var r = etat.reponses[p.ref];
    if (!r) return false;
    if (p.libre) return !!(r.note && r.note.trim());
    return !!r.choix;
  }

  function nbRepondus() {
    return pointsDecidables().filter(estRepondu).length;
  }

  function tableauHtml(t, chiffres) {
    if (!t) return "";
    var h = '<div class="bloc">';
    if (t.legende) h += '<div class="intitule">' + ech(t.legende) + "</div>";
    h += '<div class="tableau-enveloppe"><table><thead><tr>';
    t.colonnes.forEach(function (c, i) {
      h += "<th" + (chiffres && i > 0 ? ' class="chiffre"' : "") + ">" + ech(c) + "</th>";
    });
    h += "</tr></thead><tbody>";
    t.lignes.forEach(function (l) {
      h += "<tr" + (l.marque ? ' class="marque-ligne"' : "") + ">";
      l.cells.forEach(function (c, i) {
        var cls = [];
        if (chiffres && i > 0) cls.push("chiffre");
        if (l.ton && i > 0) cls.push(l.ton);
        h += "<td" + (cls.length ? ' class="' + cls.join(" ") + '"' : "") + ">" + ech(c) + "</td>";
      });
      h += "</tr>";
    });
    h += "</tbody></table></div></div>";
    return h;
  }

  /** Une fiche déjà arbitrée est réduite, sauf si le lecteur l'a rouverte. */
  function estReduite(p) {
    return !p.sansDecision && estRepondu(p) && !deplies[p.ref];
  }

  function ficheReduiteHtml(p) {
    var r = etat.reponses[p.ref] || {};
    var detail = p.libre ? (r.note || "").trim().split("\n")[0] : libelleChoix(p, r.choix);
    var h = '<article class="fiche reduite" id="p-' + p.ref + '"' + (p.groupe === "bloquant" ? ' data-bloquant="oui"' : "") + ">";
    h += '<button type="button" class="replier" data-deplier="' + p.ref + '" aria-expanded="false">';
    h += '<span class="fiche-ref">' + ech(p.ref) + "</span>";
    h += '<span class="replier-titre">' + ech(p.titre) + '<span class="fiche-sim">' + ech(p.simulateur) + "</span></span>";
    h += '<span class="resolu">' + (p.libre ? "Répondu" : "Arbitré") + "</span>";
    if (detail) h += '<span class="resolu-detail">' + ech(detail) + "</span>";
    h += '<span class="chevron" aria-hidden="true">▾</span>';
    h += "</button></article>";
    return h;

        : "<strong>Envoyez-les à Clément</strong> : elles ne sont pas conservées sur cette page."
    ];
    var h = '<aside class="mode-emploi"><ol>';
    etapes.forEach(function (t, i) {

    h += "<h3>" + ech(p.titre) + '<span class="fiche-sim">' + ech(p.simulateur) + "</span></h3></div>";

    h += '<div class="fiche-corps">';
    h += '<div class="bloc"><div class="intitule">Ce que voyait l\'utilisateur</div><p>' + ech(p.constat) + "</p></div>";
    h += '<div class="bloc"><div class="intitule">Pourquoi cela paraît anormal</div><p class="doux">' + ech(p.raison) + "</p></div>";
    if (p.comparaison) h += tableauHtml(p.comparaison, false);
    if (p.tableau) h += tableauHtml(p.tableau, true);
    if (p.encart) h += '<div class="encart">' + p.encart + "</div>";
    h += '<div class="bloc"><div class="intitule">Ce qui a été changé</div><p class="doux">' + ech(p.change) + "</p></div>";
    h += "</div>";

    if (!p.sansDecision) {
      h += '<div class="reponse">';
      h += '<div class="bloc"><div class="intitule">Votre décision</div><p style="margin-bottom:4px">' + ech(p.question) + "</p></div>";

      if (!p.libre) {
        var opts = p.options || OPTIONS_DEFAUT;
        h += '<div class="choix" role="group">';
        opts.forEach(function (o) {
          var actif = r.choix === o.cle;
          h += '<button type="button" data-ref="' + p.ref + '" data-choix="' + o.cle + '"' +
            ' data-ton="' + (o.ton || "neutre") + '" aria-pressed="' + (actif ? "true" : "false") + '">' +
            '<span class="puce"></span>' + ech(o.libelle) + "</button>";
        });
        h += "</div>";
      }

      if (p.complements && p.complements.length) {
        h += '<div class="sous-q"><div class="intitule">Questions complémentaires</div>';
        p.complements.forEach(function (c) { h += "<p>" + ech(c) + "</p>"; });
        h += "</div>";
      }

      h += '<textarea data-ref="' + p.ref + '" placeholder="' +
        (p.libre ? "Votre réponse" : "Précision, source, millésime, ou motif du refus") +
        '">' + ech(r.note || "") + "</textarea>";
      h += "</div>";
    }

    h += "</article>";
    return h;
  }

  function rendre() {
    var h = "";

    h += '<header class="bandeau"><div class="bandeau-corps">';
    h += '<h1 class="marque">Arbitrages fiscaux <span>· simulateurs Arthur Beldi</span></h1>';
    h += '<div class="jauge"><div class="jauge-piste"><div class="jauge-part" id="jauge"></div></div>';
    h += '<div class="jauge-txt" id="jauge-txt"></div></div>';
    h += "</div></header>";

    h += '<div class="page">';

    h += '<nav class="sommaire" aria-label="Sommaire">';
    h += '<div class="sommaire-titre">Points relevés</div>';
    POINTS.forEach(function (p) {
      var etatPastille = p.sansDecision ? "info" : (estRepondu(p) ? "repondu" : "attente");
      h += '<button class="som-lien" type="button" data-vers="' + p.ref + '">';
      h += '<span class="pastille" data-etat="' + etatPastille + '"></span>';
      h += '<span class="som-ref">' + ech(p.ref) + "</span>";
      h += "<span>" + ech(p.simulateur) + "</span></button>";
    });
    h += "</nav>";

    h += '<main class="flux">';
    h += '<div id="mode-emploi">' + modeEmploiHtml() + "</div>";
    GROUPES.forEach(function (g) {
      var liste = POINTS.filter(function (p) { return p.groupe === g.cle; });
      if (!liste.length) return;
      h += '<section class="groupe">';
      h += '<div class="groupe-tete"><span class="etiquette" data-ton="' + g.ton + '">' + ech(g.etiquette) + "</span>";
      h += "<h2>" + ech(g.titre) + "</h2><p>" + ech(g.chapeau) + "</p></div>";
      liste.forEach(function (p) { h += ficheHtml(p); });
      h += "</section>";
    });

    h += '<footer class="pied">';
    h += "<div>Ces vérifications garantissent que les simulateurs continuent de faire ce qu'ils faisaient. Elles ne garantissent pas que ce qu'ils font est juridiquement exact.</div>";
    h += "<div>Toutes les valeurs de référence utilisées par les tests portent aujourd'hui la mention « non validé ». C'est votre validation, point par point, qui leur donnera la valeur d'une garantie fiscale et non seulement technique.</div>";
    h += '<div class="actions-pied">';
    h += '<button class="btn" type="button" id="copier">Copier la synthèse</button>';
    h += "</div>";
    h += '<div class="mot" id="mot-pied"></div>';
    h += "</footer>";

    h += "</main></div>";

    h += '<div class="barre" id="barre" hidden>';
    h += '<span class="barre-txt" id="barre-txt"></span>';
    h += '<button class="btn btn-fort" type="button" id="enregistrer">Enregistrer</button>';
    h += "</div>";

    document.getElementById("app").innerHTML = h;
    majJauge();
    brancher();
  }

  function majJauge() {
    var total = pointsDecidables().length;
    var faits = nbRepondus();
    var j = document.getElementById("jauge");
    if (j) j.style.width = (total ? (faits / total) * 100 : 0) + "%";
    var t = document.getElementById("jauge-txt");
    if (t) t.textContent = faits + " / " + total + " arbitré" + (faits > 1 ? "s" : "");
    if (t && total === 0) t.textContent = "aucun arbitrage attendu";
  }

  function majPastilles() {
    POINTS.forEach(function (p) {
      if (p.sansDecision) return;
      var b = document.querySelector('[data-vers="' + p.ref + '"] .pastille');
      if (b) b.setAttribute("data-etat", estRepondu(p) ? "repondu" : "attente");
    });
  }

  function marquerModifie() {
    enAttente = true;
    ecrireBrouillon();
    rafraichirBarre();
  }

  /**
   * La barre s'adapte au droit d'écriture réel du lecteur.
   * Un lecteur invité ne peut pas republier la page : on lui propose alors de
   * copier ses réponses plutôt que de lui présenter un bouton inopérant.
   */
  function rafraichirBarre() {
    var barre = document.getElementById("barre");
    if (!barre || !enAttente) return;
    var txt = document.getElementById("barre-txt");
    var bouton = document.getElementById("enregistrer");
    bouton.disabled = false;
    if (capacite === "oui") {
      txt.textContent = "Modifications non enregistrées";
      bouton.textContent = "Enregistrer";
    } else if (capacite === "non") {
      txt.textContent = "Vos réponses restent sur cet appareil";
      bouton.textContent = "Copier mes réponses";
    } else {
      txt.textContent = "Vérification en cours";
      bouton.textContent = "Enregistrer";
      bouton.disabled = true;
    }
    barre.hidden = false;
  }

  /** Écouteurs d'une fiche : rejoués à chaque fois qu'elle est redessinée. */
  function brancherFiche(racine) {
    racine.querySelectorAll("[data-deplier]").forEach(function (b) {
      b.addEventListener("click", function () {
        deplier(b.getAttribute("data-deplier"));
      });
    });

    racine.querySelectorAll(".choix button").forEach(function (b) {
      b.addEventListener("click", function () {
        var ref = b.dataset.ref;
        var r = etat.reponses[ref] || {};
        r.choix = r.choix === b.dataset.choix ? null : b.dataset.choix;
        etat.reponses[ref] = r;
        document.querySelectorAll('.choix button[data-ref="' + ref + '"]').forEach(function (autre) {
          autre.setAttribute("aria-pressed", autre.dataset.choix === r.choix ? "true" : "false");
        });
        majJauge();
        majPastilles();
        marquerModifie();
      });
    });

    racine.querySelectorAll("textarea[data-ref]").forEach(function (t) {
      t.addEventListener("input", function () {
        var r = etat.reponses[t.dataset.ref] || {};
        r.note = t.value;
        etat.reponses[t.dataset.ref] = r;
        majJauge();
        majPastilles();
        marquerModifie();
      });
    });
  }

  /** Rouvre une fiche réduite sans redessiner toute la page. */
  function deplier(ref) {
    deplies[ref] = true;
    var point = null;
    POINTS.forEach(function (p) { if (p.ref === ref) point = p; });
    var ancien = document.getElementById("p-" + ref);
    if (!point || !ancien) return;
    var enveloppe = document.createElement("div");
    enveloppe.innerHTML = ficheHtml(point);
    var nouveau = enveloppe.firstChild;
    ancien.parentNode.replaceChild(nouveau, ancien);
    brancherFiche(nouveau);
    var premier = nouveau.querySelector(".choix button, textarea");
    if (premier) premier.focus({ preventScroll: true });
  }

  function brancher() {
    brancherFiche(document);

    document.querySelectorAll(".som-lien").forEach(function (b) {
      b.addEventListener("click", function () {
        var cible = document.getElementById("p-" + b.dataset.vers);
        if (cible) cible.scrollIntoView({ behavior: "smooth", block: "start" });
      });

    });

    var enr = document.getElementById("enregistrer");
    if (enr) enr.addEventListener("click", function () {
      if (capacite === "oui") enregistrer(); else copierReponses();
    });

    var cop = document.getElementById("copier");
    if (cop) cop.addEventListener("click", function () {
      var texte = synthese();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texte).then(function () {
          dire("Synthèse copiée dans le presse-papiers.", "ok");
        }, function () {
          dire("La copie a échoué. Utilisez le téléchargement.", "stop");
        });
      } else {
        dire("La copie n'est pas disponible dans ce navigateur.", "stop");
      }
    });

  }

  function dire(message, ton) {
    var m = document.getElementById("mot-pied");
    if (!m) return;
    m.textContent = message;
    if (ton) m.setAttribute("data-ton", ton); else m.removeAttribute("data-ton");
  }

  function libelleChoix(p, cle) {
    var opts = p.options || OPTIONS_DEFAUT;
    for (var i = 0; i < opts.length; i++) if (opts[i].cle === cle) return opts[i].libelle;
    return "—";
  }

  function synthese() {
    var l = ["# Arbitrages du référent fiscal", ""];
    if (etat.maj) l.push("Dernier enregistrement : " + etat.maj, "");
    GROUPES.forEach(function (g) {
      var liste = POINTS.filter(function (p) { return p.groupe === g.cle && !p.sansDecision; });
      if (!liste.length) return;
      l.push("## " + g.titre, "");
      liste.forEach(function (p) {
        var r = etat.reponses[p.ref] || {};
        l.push("### " + p.ref + " — " + p.titre + " (" + p.simulateur + ")");
        if (!p.libre) l.push("Décision : " + (r.choix ? libelleChoix(p, r.choix) : "en attente"));
        if (r.note && r.note.trim()) l.push("", r.note.trim());
        else if (p.libre) l.push("Réponse : en attente");
        l.push("");
      });
    });
    return l.join("\n");
  }

  function documentPublie() {
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("app-js").textContent;
    etat.maj = new Date().toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" });
    var json = JSON.stringify({ reponses: etat.reponses, maj: etat.maj });
    return [
      "<!doctype html>",
      '<html lang="fr"><head><meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      "<title>Arbitrages fiscaux</title>",
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">',
      "<style id=\"css\">" + css + "</style>",
      "</head><body>",
      '<div id="app"></div>',
      '<script id="etat" type="application/json">' + json + "<\/script>",
      '<script id="app-js">' + js + "<\/script>",
      "</body></html>"
    ].join("\n");
  }

  function enregistrer() {
    if (!artifact) { dire("Cette vue ne permet pas d'enregistrer.", "stop"); return; }
    var bouton = document.getElementById("enregistrer");
    bouton.disabled = true;
    document.getElementById("barre-txt").textContent = "Enregistrement…";
    artifact.publish(documentPublie()).then(function () {
      enAttente = false;
      effacerBrouillon();
      document.getElementById("barre").hidden = true;
    }, function (err) {
      var code = err && err.code;
      if (code === "conflict") {
        document.getElementById("barre-txt").textContent = "Quelqu'un a enregistré avant vous, la page se recharge";
      } else if (code === "not_granted" || code === "not_writer") {
        document.getElementById("barre-txt").textContent = "Vous consultez cette page en lecture seule";
      } else {
        document.getElementById("barre-txt").textContent = "Enregistrement impossible, réessayez";
        bouton.disabled = false;
      }
    });
  }

  var brouillonRestaure = appliquerBrouillon();

  rendre();

  if (brouillonRestaure) {
    enAttente = true;
    rafraichirBarre();
  }

  window.addEventListener("beforeunload", function (e) {
    if (enAttente && capacite === "oui") { e.preventDefault(); e.returnValue = ""; }
  });

  if (!window.claude || !window.claude.use) {
    capacite = "non";
    var me0 = document.getElementById("mode-emploi");
    if (me0) me0.innerHTML = modeEmploiHtml();
    rafraichirBarre();
  }

  if (window.claude && window.claude.use) {
    claude.use("artifact").then(function (a) {
      artifact = a;
      capacite = a ? "oui" : "non";
      var me = document.getElementById("mode-emploi");
      if (me) me.innerHTML = modeEmploiHtml();
      rafraichirBarre();
    });
  }
})();
</script>
