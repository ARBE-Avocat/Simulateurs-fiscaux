# Contrôles automatiques du dépôt.
#
# Ces contrôles sont exactement ceux de `npm run verifier` en local : ce qui
# passe sur le poste passe ici, et inversement. Ils sont découpés en étapes
# distinctes afin que l'onglet Actions montre immédiatement lequel a échoué.
#
# Le dépôt n'a aucune dépendance de production ni de développement : il n'y a ni
# `npm ci`, ni cache, ni étape de construction. Le seul prérequis est Node.js.
name: Contrôles

on:
  push:
    branches:
      - main
      - 'clv/**'
  pull_request:
  # Permet de relancer les contrôles à la main depuis l'onglet Actions.
  workflow_dispatch:

# Une exécution par branche : un nouveau push annule la précédente, encore en
# cours, plutôt que de faire la queue.
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: Syntaxe, données et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # Version alignée sur le champ `engines` de package.json.
          node-version: '22'

      - name: Contrôler la syntaxe JavaScript
        run: npm run verifier:syntaxe

      - name: Valider les référentiels fiscaux
        run: npm run donnees:valider

      - name: Vérifier que les fichiers générés correspondent aux données
        run: npm run donnees:generer -- --verifier

      - name: Valider la série de taux de change
        run: npm run change:valider

      - name: Lancer les tests
        run: npm test
