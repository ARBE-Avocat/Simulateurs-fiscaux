# Configuration de la construction GitHub Pages.
#
# GitHub Pages sert aujourd'hui la racine de la branche `main`. Sans ce fichier,
# tout le dépôt serait publié, y compris les supports de travail internes :
# `AGENTS.md` interdit que `docs/arbitrages.html` soit servi par Pages.
#
# Ce fichier est une protection provisoire, active tant que Pages est réglé sur
# « Deploy from a branch ». La cible, décrite dans `docs/ARCHITECTURE_CIBLE.md`
# §2.6, est livrée par `.github/workflows/publier.yml` : seul le dossier `site/`
# construit par `npm run build` est publié. Une fois la source Pages basculée
# sur « GitHub Actions » dans les réglages du dépôt, ce fichier n'a plus d'effet
# et peut être supprimé.
#
# Tant qu'il sert, toute nouvelle ressource non destinée au public doit être
# ajoutée ici. `data/change/` n'est pas exclu : c'est le repli des taux de
# change, que le navigateur charge quand la BCE ne répond pas.

exclude:
  - docs/
  - tests/
  - scripts/
  - data/referentiels/
  - data/imports/
  - data/schema/
  - data/README.md
  - node_modules/
  - package.json
  - package-lock.json
  - AGENTS.md
  - AGENTS.override.md
  - CLAUDE.md
  - CHANGELOG.md
  - README.md
  - VERSION
